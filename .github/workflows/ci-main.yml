name: CI (main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detects which categories of files changed.
  detect-changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            nix:
              - '**/*.nix'
              - 'flake.lock'
              - 'pkgs/**'
              - 'hosts/**'
              - 'modules/**'
              - 'options/**'
              - 'overlays/**'
            lockfile:
              - 'flake.lock'
            packages:
              - 'pkgs/**'
              - 'flake.nix'

  # Fast gate: evaluates all flake outputs and validates their structure.
  check:
    name: Evaluate & check flake
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Show flake outputs
        run: nix flake show
      - name: Check flake
        run: nix flake check --no-build

  # Lightweight NixOS evaluation — evaluates the full system closure for each host.
  eval-nixos:
    name: Evaluate NixOS — ${{ matrix.host }}
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: needs.detect-changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        host:
          - hasty-desktop
          - vmware-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Evaluate ${{ matrix.host }} (dry-run)
        run: |
          nix build \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            --dry-run \
            --print-build-logs

  # Custom packages — only built when package sources or flake.nix change.
  build-packages:
    name: Build package — ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: needs.detect-changes.outputs.packages == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        package:
          - assets
          - opencode-claude-max-proxy
          - satty-shot
          - xwechat
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build ${{ matrix.package }}
        run: |
          nix build \
            ".#packages.x86_64-linux.mypkgs.${{ matrix.package }}" \
            --no-link \
            --print-build-logs

  # Full NixOS system build — expensive (30–60 min cold).
  # Only runs when flake.lock changes or triggered manually.
  build-nixos:
    name: Build NixOS — ${{ matrix.host }}
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: needs.detect-changes.outputs.lockfile == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        host:
          - hasty-desktop
          - vmware-desktop
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build ${{ matrix.host }}
        run: |
          nix build \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            --no-link \
            --print-build-logs
