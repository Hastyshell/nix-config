name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detects which categories of files changed.
  # All conditional jobs gate on these outputs.
  # - nix:      any Nix-related file (.nix, flake.lock, hosts/, modules/, pkgs/, …)
  # - lockfile: flake.lock specifically (triggers full rebuild)
  # - packages: pkgs/ or flake.nix (custom package derivations)
  # When none of these match (e.g. docs-only change), all downstream jobs are skipped.
  detect-changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            nix:
              - '**/*.nix'
              - 'flake.lock'
              - 'pkgs/**'
              - 'hosts/**'
              - 'modules/**'
              - 'options/**'
              - 'overlays/**'
            lockfile:
              - 'flake.lock'
            packages:
              - 'pkgs/**'
              - 'flake.nix'

  # Fast gate: evaluates all flake outputs and validates their structure.
  # Catches syntax errors, missing imports, and option type mismatches in seconds.
  # Skipped for documentation-only changes (no Nix files touched).
  check:
    name: Evaluate & check flake
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Show flake outputs
        run: nix flake show
      - name: Check flake
        run: nix flake check --no-build

  # Lightweight NixOS evaluation — evaluates the full system closure for each
  # host without building any packages. Catches module option errors, missing
  # imports, and broken attribute paths cheaply.
  # Runs on every non-documentation Nix change (both hosts in parallel).
  eval-nixos-hasty-desktop:
    name: Evaluate NixOS — hasty-desktop
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: needs.detect-changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Evaluate hasty-desktop (dry-run)
        run: |
          nix build \
            ".#nixosConfigurations.hasty-desktop.config.system.build.toplevel" \
            --dry-run \
            --print-build-logs

  eval-nixos-vmware-desktop:
    name: Evaluate NixOS — vmware-desktop
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: needs.detect-changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Evaluate vmware-desktop (dry-run)
        run: |
          nix build \
            ".#nixosConfigurations.vmware-desktop.config.system.build.toplevel" \
            --dry-run \
            --print-build-logs

  # Custom packages — only built when package sources or flake.nix change.
  # Skipped for host-config-only or documentation-only changes.
  build-package-assets:
    name: Build package — assets
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: needs.detect-changes.outputs.packages == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build assets
        run: |
          nix build \
            ".#packages.x86_64-linux.mypkgs.assets" \
            --no-link \
            --print-build-logs

  build-package-opencode-claude-max-proxy:
    name: Build package — opencode-claude-max-proxy
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: needs.detect-changes.outputs.packages == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build opencode-claude-max-proxy
        run: |
          nix build \
            ".#packages.x86_64-linux.mypkgs.opencode-claude-max-proxy" \
            --no-link \
            --print-build-logs

  build-package-satty-shot:
    name: Build package — satty-shot
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: needs.detect-changes.outputs.packages == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build satty-shot
        run: |
          nix build \
            ".#packages.x86_64-linux.mypkgs.satty-shot" \
            --no-link \
            --print-build-logs

  build-package-xwechat:
    name: Build package — xwechat
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: needs.detect-changes.outputs.packages == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build xwechat
        run: |
          nix build \
            ".#packages.x86_64-linux.mypkgs.xwechat" \
            --no-link \
            --print-build-logs

  # Full NixOS system build — expensive (30–60 min cold).
  # Only runs when flake.lock changes (dependency updates need a full rebuild)
  # or triggered manually. Both hosts build in parallel.
  build-nixos-hasty-desktop:
    name: Build NixOS — hasty-desktop
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: needs.detect-changes.outputs.lockfile == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build hasty-desktop
        run: |
          nix build \
            ".#nixosConfigurations.hasty-desktop.config.system.build.toplevel" \
            --no-link \
            --print-build-logs

  build-nixos-vmware-desktop:
    name: Build NixOS — vmware-desktop
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: needs.detect-changes.outputs.lockfile == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build vmware-desktop
        run: |
          nix build \
            ".#nixosConfigurations.vmware-desktop.config.system.build.toplevel" \
            --no-link \
            --print-build-logs
