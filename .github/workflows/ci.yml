name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast gate: evaluates all flake outputs and validates their structure.
  # Runs on every push and PR. Catches syntax errors, missing imports, and
  # option type mismatches in seconds without building anything.
  #
  # NOTE — nixos-test: once NixOS tests are defined under the flake's
  # `checks` output (e.g. checks."x86_64-linux".my-test = pkgs.nixosTest { … }),
  # `nix flake check` will automatically discover and run them here.
  # GitHub Actions ubuntu-latest runners support KVM, so VM-based tests work.
  check:
    name: Evaluate & check flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - uses: cachix/cachix-action@v15
        with:
          name: hastyshell
          # Auth token is optional: reads from cache anonymously when absent,
          # uploads build outputs to Cachix when present.
          # Set CACHIX_AUTH_TOKEN in GitHub repo secrets to enable uploads.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Show flake outputs
        run: nix flake show
      - name: Check flake
        # Evaluates all checks.* outputs (including NixOS tests once defined),
        # and validates the type-correctness of packages/nixosConfigurations.
        run: nix flake check --no-build

  # Detects whether flake.lock changed so build-nixos can be skipped on PRs
  # and branches that only touch config/modules (not dependency pins).
  detect-changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      lockfile: ${{ steps.filter.outputs.lockfile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            lockfile:
              - 'flake.lock'

  # Full NixOS system build — expensive (30–60 min cold, seconds with cache).
  # Only runs when:
  #   - pushing to main (every merged commit must produce a bootable system), or
  #   - flake.lock changed on any branch/PR (dependency updates need full rebuild), or
  #   - triggered manually via workflow_dispatch.
  build-nixos:
    name: Build NixOS — ${{ matrix.host }}
    runs-on: ubuntu-latest
    needs: [check, detect-changes]
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.lockfile == 'true'
    strategy:
      fail-fast: false
      matrix:
        host:
          - hasty-desktop
          - vmware-desktop
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - uses: cachix/cachix-action@v15
        with:
          name: hastyshell
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build ${{ matrix.host }}
        run: |
          nix build \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            --no-link \
            --print-build-logs

  # Custom packages — always built on every push and PR since they are
  # lightweight compared to a full NixOS closure.
  build-packages:
    name: Build package — ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        package:
          - assets
          - opencode-claude-max-proxy
          - satty-shot
          - xwechat
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - uses: cachix/cachix-action@v15
        with:
          name: hastyshell
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build ${{ matrix.package }}
        run: |
          nix build \
            ".#packages.x86_64-linux.mypkgs.${{ matrix.package }}" \
            --no-link \
            --print-build-logs
