name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      build-packages:
        description: Build custom packages
        type: boolean
        default: false
      build-nixos:
        description: Full NixOS system build
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detects which categories of files changed.
  # All conditional jobs gate on these outputs.
  # - nix:      any Nix-related file (.nix, flake.lock, hosts/, modules/, pkgs/, …)
  # - lockfile: flake.lock specifically (triggers full rebuild)
  # - packages: pkgs/ or flake.nix (custom package derivations)
  # - should-run: whether CI should continue for this event
  # When none of these match (e.g. docs-only change), all downstream jobs are skipped.
  detect-changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.event-gate.outputs.should-run }}
      nix: ${{ steps.filter.outputs.nix }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Decide whether CI should continue
        id: event-gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          should_run=true

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "Skipping draft pull request"
            should_run=false
          elif [ "${{ github.event_name }}" = "push" ]; then
            merged_prs=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '[.[] | select(.merged_at != null)] | length')

            if [ "$merged_prs" -gt 0 ]; then
              echo "Skipping main push triggered by merged pull request"
              should_run=false
            fi
          fi

          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.event-gate.outputs.should-run == 'true'

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        if: steps.event-gate.outputs.should-run == 'true'
        id: filter
        with:
          filters: |
            nix:
              - '**/*.nix'
              - 'flake.lock'
              - 'pkgs/**'
              - 'hosts/**'
              - 'modules/**'
              - 'options/**'
              - 'overlays/**'
            lockfile:
              - 'flake.lock'
            packages:
              - 'pkgs/**'
              - 'flake.nix'

  # Fast gate: evaluates all flake outputs and validates their structure.
  # Catches syntax errors, missing imports, and option type mismatches in seconds.
  # Skipped for documentation-only changes (no Nix files touched).
  fmt:
    name: Check nix fmt
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.should-run == 'true' &&
      (needs.detect-changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Run formatter
        run: nix fmt
      - name: Verify formatting is clean
        run: git diff --exit-code

  check:
    name: Evaluate & check flake
    runs-on: ubuntu-latest
    needs: [detect-changes, fmt]
    if: >-
      needs.detect-changes.outputs.should-run == 'true' &&
      (needs.detect-changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Show flake outputs
        run: nix flake show
      - name: Check flake
        run: nix flake check --no-build

  # Lightweight NixOS evaluation — evaluates the full system closure for each
  # host without building any packages. Catches module option errors, missing
  # imports, and broken attribute paths cheaply.
  eval-nixos:
    name: Evaluate NixOS
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: >-
      !cancelled() && !failure() &&
      needs.detect-changes.outputs.should-run == 'true' &&
      (needs.detect-changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Evaluate all hosts (dry-run)
        run: |
          nix build \
            ".#nixosConfigurations.hasty-desktop.config.system.build.toplevel" \
            ".#nixosConfigurations.vmware-desktop.config.system.build.toplevel" \
            --dry-run \
            --print-build-logs

  # Custom packages — only built when package sources or flake.nix change
  # AND flake.lock hasn't changed (build-nixos already covers packages in
  # that case via a full system build).
  build-packages:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: >-
      !cancelled() && !failure() &&
      needs.detect-changes.outputs.should-run == 'true' &&
      (needs.detect-changes.outputs.packages == 'true' && needs.detect-changes.outputs.lockfile != 'true'
      || github.event_name == 'workflow_dispatch' && inputs.build-packages)
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build all packages
        run: |
          nix build \
            ".#packages.x86_64-linux.assets" \
            ".#packages.x86_64-linux.opencode-claude-max-proxy" \
            ".#packages.x86_64-linux.satty-shot" \
            ".#packages.x86_64-linux.xwechat" \
            --no-link \
            --print-build-logs

  # Full NixOS system build — expensive (30–60 min cold).
  # Only runs when flake.lock changes (dependency updates need a full rebuild)
  # or triggered manually. Both hosts are built in a single `nix build` call
  # which shares the store and parallelises internally.
  build-nixos:
    name: Build NixOS
    runs-on: ubuntu-latest
    needs: [detect-changes, check]
    if: >-
      !cancelled() && !failure() &&
      needs.detect-changes.outputs.should-run == 'true' &&
      (needs.detect-changes.outputs.lockfile == 'true'
      || github.event_name == 'workflow_dispatch' && inputs.build-nixos)
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v15
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build all hosts
        run: |
          nix build \
            ".#nixosConfigurations.hasty-desktop.config.system.build.toplevel" \
            ".#nixosConfigurations.vmware-desktop.config.system.build.toplevel" \
            --no-link \
            --print-build-logs
